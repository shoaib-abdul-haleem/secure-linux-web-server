# /etc/ssh/sshd_config.d/10-hardening.conf
#
# sshd uses the FIRST value it reads for each option, and files in sshd_config.d
# are read in alphabetical order. The name starts with 10 so it wins over files
# such as 50-cloud-init.conf. Check the result with: sudo sshd -T

PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no

# Close idle sessions after about 10 minutes (2 x 300 seconds).
ClientAliveInterval 300
ClientAliveCountMax 2

# Log the fingerprint of the key used for each login.
LogLevel VERBOSE
