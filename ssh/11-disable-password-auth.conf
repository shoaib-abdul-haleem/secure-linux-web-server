# /etc/ssh/sshd_config.d/11-disable-password-auth.conf
#
# Only installed by: sudo bash scripts/setup.sh --disable-ssh-passwords
# The script refuses to install it unless your user already has a key in
# ~/.ssh/authorized_keys, because without a key you would lock yourself out.

PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
