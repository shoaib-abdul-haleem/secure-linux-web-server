# /etc/nginx/snippets/ssl-params.conf
# TLS settings: modern protocols and ciphers only.

ssl_protocols TLSv1.2 TLSv1.3;

# ECDHE suites give forward secrecy. No DHE suites, so no dhparam file is needed.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling is left out because a self-signed certificate has no OCSP responder.
# Turn it on after switching to a Let's Encrypt certificate.
