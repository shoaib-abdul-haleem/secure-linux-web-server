# /etc/nginx/sites-available/secure-site.conf

# Port 80: redirect everything to HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# Port 443: the actual site.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    root /var/www/secure-site;
    index index.html;

    ssl_certificate     /etc/ssl/certs/secure-site.crt;
    ssl_certificate_key /etc/ssl/private/secure-site.key;
    include snippets/ssl-params.conf;
    include snippets/security-headers.conf;

    access_log /var/log/nginx/secure-site.access.log main;
    error_log  /var/log/nginx/secure-site.error.log warn;

    # At most 10 requests per second per IP (burst of 20) and 20 open connections per IP.
    limit_req  zone=req_per_ip burst=20 nodelay;
    limit_conn conn_per_ip 20;

    location / {
        try_files $uri $uri/ =404;

        # A static site only needs GET and HEAD.
        limit_except GET HEAD {
            deny all;
        }
    }

    # Hidden files such as .git or .env are never served.
    location ~ /\. {
        return 404;
    }

    # Backup and config files are never served.
    location ~* \.(bak|old|orig|save|swp|sql|conf|ini|log)$ {
        return 404;
    }
}
